<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sketchpad</title>
<meta name="theme-color" content="#1a1230">
<link rel="manifest" href="/manifest.webmanifest?t=__TOKEN__">
<link rel="icon" href="/icon-192.png?t=__TOKEN__">
<style>
  :root {
    --bg: #0f0a1a; --bar: #1a1230; --edge: #3b2a66; --ink: #e8defc; --accent: #a78bfa;
    --paper: #fbfaf6; --ok: #6ee7b7; --bad: #fca5a5;
  }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  input[type=text] { -webkit-user-select: text; user-select: text; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 15px/1.2 "FantasqueSansM Nerd Font", system-ui, sans-serif; overscroll-behavior: none; }
  #app { display: grid; grid-template-rows: auto 1fr; height: 100dvh; }
  #top { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--bar); border-bottom: 1px solid var(--edge); }
  #body { display: flex; min-height: 0; position: relative; }
  #app.right #body { flex-direction: row-reverse; }
  #panel { width: 60px; flex: none; position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0;
    background: var(--bar); border-right: 1px solid var(--edge); }
  #app.right #panel { border-right: 0; border-left: 1px solid var(--edge); }
  #app.collapsed #panel { display: none; }
  .grp { display: flex; gap: 6px; align-items: center; }
  #panel .grp { flex-direction: column; gap: 3px; }
  #panel button { width: 44px; height: 40px; min-height: 0; padding: 0; display: grid; place-items: center; border-radius: 12px; }
  #panel svg, #reopen svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #panel .hsep { width: 30px; height: 1px; background: var(--edge); margin: 3px 0; flex: none; }
  #panel .spacer { flex: 1 1 0; min-height: 0; }
  #panel .row2 { flex-direction: row; gap: 4px; }
  #panel .row2 button { width: 26px; height: 34px; border-radius: 9px; }
  #colors { display: grid !important; grid-template-columns: 1fr 1fr; gap: 5px 7px; justify-items: center; padding: 2px 0; }
  #panel .sw { width: 22px; height: 22px; }
  #sizebtn .dot { display: block; border-radius: 50%; background: currentColor; }
  #shapes, #sizepop { position: absolute; z-index: 4; left: calc(100% + 6px); padding: 6px; background: var(--bar); border: 1px solid var(--edge);
    border-radius: 12px; box-shadow: 0 8px 24px #0008; }
  #app.right #shapes, #app.right #sizepop { left: auto; right: calc(100% + 6px); }
  #sizepop { padding: 12px 14px; } #sizepop input { width: 150px; display: block; }
  #app.right #collapse svg { transform: scaleX(-1); }
  #pagesbtn { position: relative; }
  #pagesbtn.dot::after { content: ""; position: absolute; top: 5px; right: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bar); }
  #note { position: fixed; z-index: 7; left: 50%; bottom: 74px; transform: translateX(-50%); max-width: min(92vw, 620px); display: flex; gap: 10px; align-items: center;
    padding: 10px 12px 10px 16px; background: var(--bar); border: 1px solid var(--accent); border-radius: 14px; box-shadow: 0 8px 26px #000a; }
  #notetext { flex: 1; line-height: 1.3; overflow-wrap: anywhere; }
  #note button { min-height: 0; height: 36px; padding: 0 14px; border-radius: 10px; flex: none; }
  #erasebadge { position: absolute; z-index: 3; top: 10px; right: 10px; padding: 6px 12px; border-radius: 999px; background: #d12e4f; color: #fff; font-weight: 700; letter-spacing: .08em; font-size: 13px; pointer-events: none; box-shadow: 0 4px 14px #0007; }
  #pageframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--paper); }
  #zoompct { width: auto !important; padding: 0 10px !important; font: 600 14px monospace; }
  #top button.icon { width: 42px; height: 38px; min-height: 0; padding: 0; display: grid; place-items: center; border-radius: 10px; flex: none; }
  #top svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #pagespop { position: fixed; z-index: 6; min-width: 220px; max-width: 320px; padding: 6px; background: var(--bar); border: 1px solid var(--edge); border-radius: 12px; box-shadow: 0 8px 24px #0008; display: flex; flex-direction: column; gap: 4px; }
  #pagespop button { text-align: left; }
  #selbar { position: absolute; z-index: 3; display: flex; gap: 2px; padding: 4px; background: var(--bar); border: 1px solid var(--edge); border-radius: 14px; box-shadow: 0 6px 20px #0009; }
  #selbar button { width: 42px; height: 38px; min-height: 0; padding: 0; display: grid; place-items: center; border-radius: 10px; }
  #selbar svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #reopen { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; left: 0; width: 24px; height: 72px; min-height: 0; padding: 0;
    display: grid; place-items: center; border-radius: 0 12px 12px 0; }
  #reopen svg { transform: scaleX(-1); }
  #app.right #reopen { left: auto; right: 0; border-radius: 12px 0 0 12px; } #app.right #reopen svg { transform: none; }
  #app:not(.collapsed) #reopen { display: none; }
  button, input[type=text] { font: inherit; color: var(--ink); background: #261a45; border: 1px solid var(--edge);
    border-radius: 8px; padding: 8px 12px; min-height: 40px; }
  button:active { background: #33225c; }
  button.on { border-color: var(--accent); background: #3a2a6e; }
  button:disabled { opacity: .4; }
  button.send { background: var(--accent); color: #140a2a; border-color: var(--accent); font-weight: 700; }
  button.danger { border-color: #7f3a52; }
  .sw { width: 34px; height: 34px; min-height: 0; padding: 0; border-radius: 50%; border: 2px solid var(--edge); }
  .sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .sw.custom { background: radial-gradient(circle, var(--cc, transparent) 0 42%, transparent 44%), conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
  #pick { position: fixed; z-index: 5; padding: 12px; border-radius: 12px; background: var(--bar); border: 1px solid var(--edge);
    display: flex; flex-direction: column; gap: 10px; align-items: center; box-shadow: 0 8px 30px #0008; }
  #wheel { position: static; inset: auto; touch-action: none; border-radius: 50%; cursor: crosshair; }
  #pick .row { display: flex; gap: 8px; align-items: center; width: 100%; }
  #pick input[type=range] { flex: 1; width: auto; }
  #hex { width: 96px; font-family: monospace; }
  #hsl { font: 12px monospace; color: var(--accent); min-width: 12ch; white-space: nowrap; }
  #pickprev { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--edge); flex: none; }
  input[type=range] { width: 96px; accent-color: var(--accent); }
  #cap { flex: 1 1 180px; min-width: 120px; }
  [hidden] { display: none !important; }
  #wrap { position: relative; flex: 1; min-width: 0; margin: 8px; border-radius: 10px; overflow: hidden; border: 1px solid var(--edge); background: var(--paper); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 10px 16px; border-radius: 10px;
    background: var(--bar); border: 1px solid var(--edge); opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.show { opacity: 1; }
  #toast.ok { border-color: var(--ok); } #toast.bad { border-color: var(--bad); }
  #dbg { font: 12px monospace; color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button id="pagesbtn" class="icon" title="Pages: put something behind your ink"></button>
    <button id="paperbtn" class="icon" title="Paper: blank / dots / grid / lines (tap to change)"></button>
    <button id="rotbtn" class="icon" title="Rotate: lock the screen to portrait or landscape (tap to cycle)" hidden></button>
    <button id="modebtn" class="icon" title="Draw / Use: pen draws, or taps go to the page" hidden></button>
    <button id="zoompct" class="icon" title="Zoom: tap to reset to 100%" hidden></button>
    <button id="zoomlock" class="icon" title="Zoom lock: pinch zoom is on (tap to lock)"></button>
    <input id="cap" type="text" placeholder="Say what this is (optional)" autocomplete="off">
    <button id="send" class="send">Send</button>
    <span id="dbg" hidden></span>
  </div>
  <div id="body">
    <aside id="panel">
      <div class="grp" id="tools"></div>
      <div class="grp" id="shapes" hidden></div>
      <div class="hsep"></div>
      <div class="grp" id="colors"></div>
      <button id="sizebtn" title="Brush size" aria-label="Brush size"><span class="dot"></span></button>
      <div id="sizepop" hidden><input id="size" type="range" min="1" max="24" value="4" aria-label="Brush size"></div>
      <div class="hsep"></div>
      <div class="grp" id="actions">
        <button id="undo" title="Undo"></button>
        <button id="redo" title="Redo"></button>
        <button id="paste" title="Paste (copy or cut a selection first)"></button>
        <button id="clear" title="Clear (Undo brings it back)"></button>
        <button id="del" class="danger" title="Delete selection" hidden></button>
        <button id="finger" title="Finger drawing: off (off = pen only, palm ignored)"></button>
      </div>
      <div class="spacer"></div>
      <div class="grp row2"><button id="flip" title="Move the panel to the other side"></button><button id="collapse" title="Hide the panel"></button></div>
    </aside>
  <div id="wrap"><canvas id="c"></canvas>
    <div id="erasebadge" hidden>ERASE</div>
    <div id="selbar" hidden>
      <button id="selcut" title="Cut"></button><button id="selcopy" title="Copy"></button><button id="selpaste" title="Paste"></button><button id="seldel" class="danger" title="Delete"></button>
    </div></div>
    <button id="reopen" title="Show the panel"></button>
  </div>
</div>
<div id="pagespop" hidden></div>
<div id="note" hidden><span id="notetext"></span><button id="noteopen" class="send">Open</button><button id="noteclose" title="Dismiss">Dismiss</button></div>
<div id="pick" hidden>
  <canvas id="wheel"></canvas>
  <div class="row"><span>Light</span><input id="lum" type="range" min="0" max="100" aria-label="Lightness"></div>
  <div class="row"><span id="pickprev"></span><input id="hex" type="text" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Hex colour"><span id="hsl"></span></div>
  <button id="pickok">Done</button>
</div>
<div id="toast" role="status"></div>
<script>
"use strict";
// ---- constants (everything tunable lives here) ----
const COLORS = ["#16121f", "#d12e4f", "#1f6feb", "#1a9b5b", "#e0881a", "#7c3aed"];
const TOOLS = [["pen", "Pen"], ["shapes", "Shapes"], ["fill", "Fill"], ["eraser", "Eraser"], ["select", "Select"]];
const FILL_TOL = 150;          // bucket fill: how far (sum of R+G+B differences) a pixel may be from the one tapped and still be filled; high enough to swallow the anti-aliased halo of a line
const ZOOM_MIN = 0.5, ZOOM_MAX = 8; // pinch / wheel zoom limits
const GESTURE_DECIDE_PX = 14;       // two fingers must move this far before the gesture is decided: pinch (zoom) or drag together (pan)
const GESTURE_BOTH_PX = 6, GESTURE_ONE_PX = 90; // ...and BOTH fingers must have moved a little (each finger reports separately), unless one has clearly moved far
const PAPER_STYLES = ["blank", "dots", "grid", "lines"]; // built-in paper: drawn in world space, so it fills the canvas at any zoom/pan and in the sent image
const PAPER_STEP = 32, PAPER_INK = "#b8b0cc", PAPER_DOT = 1.7;
const PASTE_OFFSET = 24;       // each paste lands this many px down-right of the last one, so copies don't hide the original
const PEN_LIFT_GUARD_MS = 150; // no side-button toggle this soon after the pen last touched (a lifting tip reports buttons=1 with tiny pressure)
const TOGGLE_DELAY_MS = 90;    // the toggle waits this long and is cancelled if the pen lands: light contact looks like a button press until the pointerdown arrives
const SHAPES = [["line", "Line"], ["arrow", "Arrow"], ["rect", "Rect"], ["ellipse", "Ellipse"]];
const CUSTOM_START = "#0ea5a5"; // first colour of the custom slot (wheel / hex / HSL)
const WHEEL_PX = 220;           // css size of the colour wheel
const PAPER = "#fbfaf6", ACCENT = "#7c3aed";
const SVG = d => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICON = { // inline icons, 24x24 grid, stroked with the button's text colour
  pen: SVG('<path d="M4 20l1-4L16.5 4.5a2 2 0 013 3L8 19z"/><path d="M14 7l3 3"/>'),
  shapes: SVG('<rect x="3" y="11" width="9" height="9" rx="1"/><circle cx="16" cy="8" r="5"/>'),
  fill: SVG('<path d="M5 11l6-6 8 8-6 6a2 2 0 01-3 0l-5-5a2 2 0 010-3z"/><path d="M20 16c1 1.5 1.5 2.5 1.5 3.5a1.5 1.5 0 01-3 0c0-1 .5-2 1.5-3.5z"/>'),
  eraser: SVG('<path d="M20 20H9l-5-5 9-10 7 7-6 7"/><path d="M7.5 11.5l6 6"/>'),
  select: SVG('<path d="M12 4c5 0 8 2 8 5s-3 5-8 5-8-2-8-5 3-5 8-5z" stroke-dasharray="3 2.5"/><path d="M9 14c-1 3 0 5 3 6"/>'),
  line: SVG('<path d="M5 19L19 5"/>'), arrow: SVG('<path d="M5 19L19 5M10 5h9v9"/>'),
  rect: SVG('<rect x="4" y="6" width="16" height="12" rx="1"/>'), ellipse: SVG('<ellipse cx="12" cy="12" rx="9" ry="6"/>'),
  undo: SVG('<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/>'), redo: SVG('<path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/>'),
  clear: SVG('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'), del: SVG('<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>'),
  finger: SVG('<path d="M9 13V5.5a1.5 1.5 0 013 0V11M12 11V4.5a1.5 1.5 0 013 0V12M15 11.5V7a1.5 1.5 0 013 0v7c0 4-2.5 6-6 6s-4.5-1.5-6.5-4.5L3.5 13.5a1.5 1.5 0 012.3-1.9L9 14"/>'),
  cut: SVG('<circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M8 7.6L20 18M8 16.4L20 6"/>'),
  copy: SVG('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>'),
  paste: SVG('<rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5V4a1 1 0 011-1h4a1 1 0 011 1v1M9.5 12h5M9.5 16h3.5"/>'),
  rotate: SVG('<path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/>'),
  lock: SVG('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>'),
  unlock: SVG('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 017.5-1.5"/>'),
  paper: SVG('<rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/>'),
  pages: SVG('<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>'),
  draw: SVG('<path d="M4 20l1-4L16.5 4.5a2 2 0 013 3L8 19z"/><path d="M14 7l3 3"/>'),
  use: SVG('<path d="M9 13V5.5a1.5 1.5 0 013 0V11M12 11V4.5a1.5 1.5 0 013 0V12M15 11.5V7a1.5 1.5 0 013 0v7c0 4-2.5 6-6 6s-4.5-1.5-6.5-4.5L3.5 13.5a1.5 1.5 0 012.3-1.9L9 14"/>'),
  flip: SVG('<path d="M7 8h12l-3-3M17 16H5l3 3"/>'), collapse: SVG('<path d="M15 5l-7 7 7 7"/>'), reopen: SVG('<path d="M15 5l-7 7 7 7"/>'),
};
const MAX_EXPORT = 2000;       // longest side of the sent PNG
const EXPORT_PAD = 24;         // margin around ink that lies outside the original canvas (after zoom/pan you can write past its edge)
const HOLD_MS = 550;           // hold the pen still this long to snap a stroke to a line
const STRAIGHT_MAX_DEV = 0.12; // snap only if the stroke is this close to straight (fraction of its length)
const PEN_MIN_P = 0.03;        // below this pen pressure the tip is NOT touching: the S Pen side button shows up as buttons=1 with ~0 pressure
const HANDLE_R = 24;           // touch radius of the resize handles
const UNDO_LIMIT = 200;
const TAP_MS = 350, TAP_SLOP = 20; // multi-finger tap gestures
const params = new URLSearchParams(location.search);
const POLL_MS = +(params.get("poll") || 5000); // how often the tab looks for new things from Claude
const token = params.get("t") || "", DEBUG = params.get("debug") === "1";

// ---- state ----
const wrap = document.getElementById("wrap"), cv = document.getElementById("c"), ctx = cv.getContext("2d");
const base = document.createElement("canvas"), bctx = base.getContext("2d"); // committed objects, redrawn only when they change
const $ = id => document.getElementById(id);
let objects = [], undoStack = [], redoStack = [], sel = new Set(), hidden = new Set();
let activePage = "", useMode = false; // page shown behind the ink; Use = taps go to the page instead of the pen
let view = { s: 1, x: 0, y: 0 }; // zoom + pan: screen px = world px * s + (x, y). Objects live in world px; the SENT image is always the unzoomed canvas
let zoomLocked = false, pinch = null, pinchRaf = 0; const tpos = new Map();
let paperStyle = "blank";
let clip = [], pasteN = 0; // clipboard: deep copies of the objects last copied/cut
let tool = "pen", shapeKind = "line", color = COLORS[0], fingerOK = false, cur = null, holdT = 0, nextId = 1;
// S Pen side button = TAP TO TOGGLE Pen <-> Eraser. On Samsung + Chrome the only reliable signals are: a hover move with buttons=1 and ~0 pressure (button
// pressed in the air), and a contextmenu in the middle of a stroke. Holding the button while touching is useless: Chromium's stylus text selector swallows
// those touches before the page sees them.
let airBtn = false;           // the button is currently seen held in the air (rising edge = one toggle)
let ignoreHeld = false;       // the press already acted mid-stroke; ignore the "still held" hover that follows the lift
let prevTool = "pen", lastToggle = 0;
let penArmed = false, lastPenUp = 0, toggleT = 0; // armed = a real hover with buttons=0 was seen since the pen last touched; only then can buttons=1 be a button tap
const dpr = () => window.devicePixelRatio || 1;

// ---- toolbar ----
COLORS.forEach((c, i) => {
  const b = document.createElement("button");
  b.className = "sw" + (i === 0 ? " on" : ""); b.style.background = c; b.setAttribute("aria-label", "colour " + c);
  b.onclick = () => { color = c; if (tool === "eraser" || tool === "select") setTool("pen"); document.querySelectorAll(".sw").forEach(s => s.classList.toggle("on", s === b)); };
  $("colors").appendChild(b);
});
// ---- custom colour slot: wheel (hue = angle, saturation = radius) + lightness slider + hex field, all in HSL ----
const hslToHex = (h, s, l) => { s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return "#" + [f(0), f(8), f(4)].map(v => Math.round(v * 255).toString(16).padStart(2, "0")).join(""); };
const hexToHsl = hex => { const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  let h = 0, s = 0;
  if (d) { s = d / (1 - Math.abs(2 * l - 1)); h = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
  return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) }; };
let hsl = hexToHsl(CUSTOM_START), wheelImg = null, wheelL = -1;
const wheel = $("wheel"), wctx = wheel.getContext("2d"), customBtn = document.createElement("button");
wheel.width = wheel.height = Math.round(WHEEL_PX * dpr()); wheel.style.width = wheel.style.height = WHEEL_PX + "px";
customBtn.className = "sw custom"; customBtn.setAttribute("aria-label", "custom colour"); customBtn.style.setProperty("--cc", CUSTOM_START);
$("colors").appendChild(customBtn);
function drawWheel() {
  const W = wheel.width, R = W / 2;
  if (wheelL !== hsl.l) { // the disc only changes with lightness: cache it
    wheelImg = wctx.createImageData(W, W); wheelL = hsl.l;
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const dx = x - R + .5, dy = y - R + .5, r = Math.hypot(dx, dy), i = (y * W + x) * 4;
      if (r > R) continue;
      const hex = hslToHex((Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360, r / R * 100, hsl.l);
      wheelImg.data[i] = parseInt(hex.slice(1, 3), 16); wheelImg.data[i + 1] = parseInt(hex.slice(3, 5), 16); wheelImg.data[i + 2] = parseInt(hex.slice(5, 7), 16); wheelImg.data[i + 3] = 255;
    }
  }
  wctx.putImageData(wheelImg, 0, 0);
  const a = hsl.h * Math.PI / 180, rr = hsl.s / 100 * R, px = R + Math.cos(a) * rr, py = R + Math.sin(a) * rr;
  wctx.lineWidth = 3 * dpr(); wctx.strokeStyle = "#fff"; wctx.beginPath(); wctx.arc(px, py, 9 * dpr(), 0, 7); wctx.stroke();
  wctx.lineWidth = 1.5 * dpr(); wctx.strokeStyle = "#000"; wctx.beginPath(); wctx.arc(px, py, 11 * dpr(), 0, 7); wctx.stroke();
}
function applyCustom(exactHex) { // exactHex: a typed/starting hex is kept as-is (HSL is rounded to whole numbers, so it would drift)
  const hex = exactHex || hslToHex(hsl.h, hsl.s, hsl.l);
  color = hex; customBtn.dataset.hex = hex; customBtn.style.setProperty("--cc", hex); $("pickprev").style.background = hex; $("lum").value = hsl.l;
  $("hsl").textContent = `${hsl.h}° ${hsl.s}% ${hsl.l}%`; if (document.activeElement !== $("hex")) $("hex").value = hex;
  if (tool === "eraser" || tool === "select") setTool("pen");

      headers: { "X-Token": token, "Content-Type": "image/png", "X-Caption": encodeURIComponent($("cap").value),
        ...(activePage ? { "X-Page": activePage, "X-Viewport": Math.round(r.width) + "x" + Math.round(r.height), "X-Origin": x0.toFixed(1) + "," + y0.toFixed(1), "X-Scale": k.toFixed(4) } : {}) } });
    const j = await resp.json();
    if (!resp.ok) throw new Error(j.error || resp.status);
    toast("Sent " + j.name); $("cap").value = "";
  } catch (err) { toast("Send failed: " + err.message, "bad"); }
  finally { $("send").disabled = false; }
};

new ResizeObserver(fit).observe(wrap);
try { // restore the saved canvas
  const saved = JSON.parse(localStorage.getItem(CANVAS_KEY) || "[]");
  if (Array.isArray(saved) && saved.length) { objects = saved; nextId = Math.max(nextId, ...saved.map(o => (+o.id || 0) + 1)); }
} catch (_) { /* unreadable: start empty */ }
updateUI(); fit();
</script>
</body>
